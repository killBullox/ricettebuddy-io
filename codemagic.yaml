# Build iOS di Beet It! su Mac cloud ON-DEMAND (Codemagic) -> TestFlight.
# Replica la build di produzione (ship.sh): Swift Package Manager (NIENTE
# CocoaPods), aggiunta del target ShareExtension, firma con la App Store Connect
# API key. Nessuna configurazione manuale nella UI: variabili e chiave sono
# impostate via API di Codemagic (gruppo "beetit").
#
# Variabili nel gruppo "beetit" (secure): SUPABASE_URL, SUPABASE_ANON_KEY,
# API_BASE, APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER,
# APP_STORE_CONNECT_ISSUER_ID, CERTIFICATE_PRIVATE_KEY.

workflows:
  ios-testflight:
    name: Beet It! iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # AUTOMATICO: ogni push su main builda e pubblica su TestFlight da solo.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - beetit
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "io.beetit.recipes"
        SHARE_BUNDLE_ID: "io.beetit.recipes.ShareExtension"
        APP_STORE_APPLE_ID: 6788669009
    scripts:
      - name: Flutter pub get
        script: cd app && flutter pub get
      - name: Config-only (genera pbxproj/SPM, SENZA firma)
        script: |
          cd app
          set -o pipefail
          flutter build ios --config-only --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=API_BASE=$API_BASE 2>&1 | tee "$CM_BUILD_DIR/beetit-build.log"
      - name: Aggiungi il target ShareExtension
        script: |
          cd app
          gem install xcodeproj --no-document 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby ios/scripts/add_share_target.rb ios/Runner.xcodeproj
      - name: Firma (App Store Connect API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$SHARE_BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Prossimo build number da TestFlight
        script: |
          BN=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          echo "NEW_BUILD_NUMBER=$((BN + 1))" >> $CM_ENV
          echo "build number: $((BN + 1))"
      - name: Build IPA firmata
        script: |
          cd app
          set -o pipefail
          flutter build ipa --release \
            --build-number=$NEW_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=API_BASE=$API_BASE \
            --export-options-plist=$HOME/export_options.plist 2>&1 | tee -a "$CM_BUILD_DIR/beetit-build.log"
    artifacts:
      - app/build/ios/ipa/*.ipa
      - beetit-build.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
